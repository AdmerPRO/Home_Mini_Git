<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Home Mini Git</title>
    <link rel="stylesheet" href="/register/style.css">
</head>
<body>
    <div class="container">
        <h1>Register</h1>
        <p class="by">by <a href="https://github.com/AdmerPRO/Home_Mini_Git" target="_blank">AdmerPRO</a></p>

        <form id="registerForm">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn green">Register</button>
        </form>

        <p id="errorMsg" style="color: red; min-height: 1.2em;"></p>

        <p class="cta">Already have an account? <a href="/login">Login here</a></p>
    </div>

    <script src="/register/script.js"></script>
</body>
</html>
