<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Home Mini Git</title>
    <link rel="stylesheet" href="/login/style.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <p class="by">by <a href="https://github.com/AdmerPRO/Home_Mini_Git" target="_blank">AdmerPRO</a></p>

        <form id="loginForm">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn blue">Login</button>
        </form>

        <p id="errorMsg" style="color: red; min-height: 1.2em;"></p>

        <p class="cta">Don't have an account? <a href="/register">Register here</a></p>
    </div>

    <script src="/login/script.js"></script>
</body>
</html>
